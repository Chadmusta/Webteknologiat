    <div class="container-fluid mb-5 mt-5 w-50 p-5 bg-light">
        <h1 class="text-center mb-5">Laskin</h1>
        <div class="input-group mb-3">
            <button class="plus btn-outline-secondary" onclick="increaseLeftvalue()" type="button"
                id="button-addon1">+</button>
            <input id="input1" type="text" class="form-control" disabled placeholder="Input group example"
                aria-label="Default select example" aria-describedby="button-addon1">
            <button class="minus btn-outline-secondary" onclick="decreaseLeftvalue()" type="button"
                id="button-addon1">-</button>


            <div class="mx-5">

                <select class="form-select" id="operationSelect" aria-label="Default select example">

                    <option value="+">+</option>
                    <option value="-">-</option>
                    <option value="*">*</option>
                    <option value="/">/</option>
                </select>
            </div>

            <button class="btn btn-outline-secondary" onclick="increaseRightvalue()" type="button"
                id="button-addon1">+</button>
            <input id="input2" type="text" class="form-control" disabled placeholder="Input group example"
                aria-label="Default select example" aria-describedby="button-addon1">
            <button class="btn btn-outline-secondary" onclick="decreaseRightvalue()" type="button"
                id="button-addon1">-</button>


        </div>
        <div class="d-grid gap-2 mb-3 col-6 mx-auto">
            <button class="btn btn-primary" type="button" onclick="calculate()">Calculate</button>
        </div>

        <div class="input-group mb-3">
            <input type="text" id="result" disabled class="form-control" aria-label="Sizing example input"
                aria-describedby="inputGroup-sizing-default">
        </div>

    </div>

    <div class="container-fluid w-50 p-5 bg-light">
        <p id="counter" class="text-left">Laskettuja laskuja: 0</p>
    </div>

    <div class="container-fluid w-50 p-5 bg-light">
