<body>
    <div class="container-fluid align-items-center">
        <fieldset style='border:3px dashed;'>
            <h1>Tilaa pizza</h1>
            <div id="section">
                <img src="kuvat/pizza.img" width="400" height="300">
                <div class="icon">
                    <p>Pizza.</p>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor"
                        class="bi bi-info-circle" viewBox="0 0 16 16">
                        <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14m0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16" />
                        <path
                            d="m8.93 6.588-2.29.287-.082.38.45.083c.294.07.352.176.288.469l-.738 3.468c-.194.897.105 1.319.808 1.319.545 0 1.178-.252 1.465-.598l.088-.416c-.2.176-.492.246-.686.246-.275 0-.375-.193-.304-.533zM9 4.5a1 1 0 1 1-2 0 1 1 0 0 1 2 0" />
                    </svg>
                </div><br>
                    <div class="info">Tarvittaessa liätietoja allergeeneista ota yhteyttä ravintolan henkilökuntaan.
                    </div>
</body>
</div>
<h3>Valitse koko</h3>
<div>
    <label>Koko</label>
    <select id="koko">
        <option selected>valitse</option>
        <option value="6.00">Tavallinen pizza</option>
        <option value="12.00">Perhepizza</option>
    </select>
</div>
<div>
    <h3>Valitse täytteet</h3><br>
    <table>
        <label>Ananas <input type="checkbox" class="tayte" value="2.00"></label><br>
        <label>Kinkku <input type="checkbox" class="tayte" value="2.00"></label><br>
        <label>Pepperoni <input type="checkbox" class="tayte" value="2.00"></label><br>
        <label>Aurajuusto <input type="checkbox" class="tayte" value="2.00"></label><br>
        <label>Tonnikala <input type="checkbox" class="tayte" value="2.00"></label><br>

        <div class="hinta">Hinta yhteensä <span input id="hinta">0.00</span> €</div>
    </table>
</div>
<div>
    <button btn-outline-secondary type="button" id="button-addon1">Tilaa</button>

</div>
</fieldset>
</div>
<script src="js/tentti.js"></script>
</body>
