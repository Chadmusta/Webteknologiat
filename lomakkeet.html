    <div class="container-fluid align-items-center">
        <h1>Lomake</h1>
    <form>
        <table>
            <tr>
                <td>
                    <fieldset>
                        <legend>Henkilötiedot</legend><!--Tekee viivan sisälle tekstin-->
                        <table>
                            <tr>
                                <td><label for="fname">Etunimi</label></td>
                                <td><input type="text" id="fname"></td>
                            </tr>
                            <tr>
                                <td><label for="lname">Sukunimi</label></td>
                                <td><input type="text" id="lname"></td>
                            </tr>
                            <tr>
                                <td><label for="password">Salasana</label></td>
                                <td><input type="password" id="password"></td>
                            </tr>
                        </table>
                    </fieldset>
                </td>
                <td>
                    <fieldset>
                        <legend>Yhteystiedot</legend>
                        <table>
                            <tr>
                                <td><input type="checkbox" id="emailselect"></td>
                                <td><label for="emailselect">Sähköposti</label></td>
                            </tr>
                            <tr>
                                <td><input type="checkbox" id="telselect"></td><!--tekee pienet boxit-->
                                <td><label for="telselect">Puhelin</label></td>
                            </tr>
                        </table>
                    </fieldset>
                </td>
            </tr>
            <tr>
                <td colspan="2">
                    <fieldset>
                        <table>
                            <tr>
                                <td colspan="2"><!--tekee boxin leveyden kahteen sarakkeeseen-->
                                    <textarea rows="10" cols="50"></textarea><!--tekee tekstikentän-->
                                </td>
                            </tr>
                            <tr>
                                <td>
                                    <input type="file" id="file"><!--tekee valitse tiedosto napin-->
                                </td>


                                <td>
                                    <input type="submit" value="Lähetä"><!--tekee lähetä napin-->
                                </td>
                            </tr>
                        </table>

                    </fieldset>
                </td>
            </tr>
        </table>
    </form>
