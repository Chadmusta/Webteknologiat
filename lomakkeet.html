<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset style="max-width:400px; padding:1rem; margin:0 auto;">

            <legend>Contact information:</legend>
            
            <label for="fname">First name:</label>
            <input type="text" id="fname" name="fname"><br>
            <label for="lname">Last name:</label>
            <input type="text" id="lname" name="lname"><br>
            <label for="email">Email:&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</label>
            <input type="email" id="email" name="contact"><br>
            <label for="tel">Telephone:</label>
            <input type="tel" id="tel" name="contact">
    
            <p>Prefered contact method:</p>
            <input type="checkbox" id="email" name="contact" value="Email">
            <label for="email">Email</label><br>
            <input type="checkbox" id="tel" name="contact" value="Telephone">
            <label for="tel">Telephone</label>            
        </fieldset>
        <fieldset style="max-width:400px; padding:1rem; margin:1rem auto 0;">
            <legend>Feedback:</legend>
            
            <label for="message_subject">Message subject:</label>
            <input type="text" id="message_subject" name="message_subject"><br><br>
            <textarea id="message" name="message" rows="11" cols="50"></textarea><br><br>
            <p>Attach a file:&nbsp;&nbsp;&nbsp;</p>
            <button type="button">Choose file</button>
            <p>No file chosen</p>
            <button type="send">Send</button>
        </fieldset>
    </form>
</body>
</html>
